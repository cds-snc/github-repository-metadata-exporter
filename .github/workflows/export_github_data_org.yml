name: GitHub repository metadata exporter (org level)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  export-data:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@a8e796fc4b02d21d73acb2d2e999f983fea7dd72 # main
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Export Data
        uses: ./
        with:
          github-app-id: ${{ secrets.SRE_BOT_RO_APP_ID }}
          github-app-installation-id: ${{ secrets.SRE_BOT_RO_INSTALLATION_ID }}
          github-app-private-key: ${{ secrets.SRE_BOT_RO_PRIVATE_KEY }}
          forwarder-mode: dcr
          azure-dce-endpoint: ${{ secrets.SENTINEL_DCE_ENDPOINT }}
          azure-dcr-immutable-ids: ${{ vars.AZURE_DCR_IMMUTABLE_IDS_MAP_GITHUB_METADATA }}
          azure-tenant-id: ${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}
          azure-client-id: ${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}
          org-data-repo: "cds-snc/github-repository-metadata-exporter" # This should only be set to true in one repo
